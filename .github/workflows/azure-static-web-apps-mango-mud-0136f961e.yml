name: Azure Static Web Apps CI/CD

# Web surface only. Native/store-only path changes do not redeploy bpmtech.no.
# See STORE_RELEASES.md and WEB_RELEASE.md.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "android/**"
      - "ios/**"
      - "store-assets/**"
      - "ANDROID.md"
      - "IOS_RELEASE.md"
      - "APP_STORE_LAUNCH.md"
      - "APPLE_APP_STORE_REUSE.md"
      - "PLAY_STORE_RELEASE.md"
      - "MICROSOFT_STORE_RELEASE.md"
      - "STORE_RELEASES.md"
      - "WEB_RELEASE.md"
      - ".github/workflows/android-*.yml"
      - ".github/workflows/ios-*.yml"
      - ".github/workflows/microsoft-store-*.yml"
      - "scripts/*-android-*.mjs"
      - "scripts/*-ios-*.mjs"
      - "scripts/*-google-play-*.mjs"
      - "scripts/*-microsoft-store*.mjs"
      - "scripts/*-app-store-*.mjs"
  # Intentionally no paths-ignore on pull_request: `closed` must always run so
  # staging environments are cleaned up even if the final commit is store-only.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fork pull requests do not receive the deployment token, so preview
  # environments are only created for branches in this repository.
  build_and_deploy_job:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        # Vite inlines VITE_* values at build time. They come from repository
        # secrets because .env is never committed.
        env:
          # The deploy action reads this env var (not a with: input) when the token is absent.
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.VITE_APPINSIGHTS_CONNECTION_STRING }}
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
          VITE_ADSENSE_SLOT_IN_ARTICLE: ${{ secrets.VITE_ADSENSE_SLOT_IN_ARTICLE }}
          VITE_ADSENSE_SLOT_MULTIPLEX: ${{ secrets.VITE_ADSENSE_SLOT_MULTIPLEX }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_MUD_0136F961E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "build" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_MUD_0136F961E }}
          action: "close"
