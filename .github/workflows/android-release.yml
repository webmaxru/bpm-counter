name: Android Play Store Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Play versionName (defaults to value in android/app/build.gradle)
        required: false
        type: string
      track:
        description: Play Console track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      upload_to_play:
        description: Upload the signed AAB to Google Play
        required: true
        default: false
        type: boolean
      regenerate_assets:
        description: Regenerate Play listing graphics/screenshots before packaging
        required: true
        default: false
        type: boolean
      status:
        description: Release status on the selected track
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed
  push:
    tags:
      # Keep distinct from squad-release package tags (`v*`) and iOS (`ios-v*`).
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: android-play-store-release
  cancel-in-progress: false

jobs:
  release:
    name: Sign AAB and optionally upload
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve release inputs
        id: release_inputs
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_TRACK: ${{ inputs.track }}
          DISPATCH_UPLOAD: ${{ inputs.upload_to_play }}
          DISPATCH_REGENERATE: ${{ inputs.regenerate_assets }}
          DISPATCH_STATUS: ${{ inputs.status }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          GRADLE_VERSION=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle | head -n 1)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_VERSION:-$GRADLE_VERSION}"
            TRACK="${DISPATCH_TRACK:-internal}"
            UPLOAD="${DISPATCH_UPLOAD:-false}"
            REGENERATE="${DISPATCH_REGENERATE:-false}"
            STATUS="${DISPATCH_STATUS:-draft}"
          else
            if [[ "$REF_NAME" != android-v* ]]; then
              echo "::error::Unexpected tag '$REF_NAME'. Expected android-vMAJOR.MINOR.PATCH."
              exit 1
            fi
            VERSION="${REF_NAME#android-v}"
            TRACK="internal"
            UPLOAD="false"
            REGENERATE="false"
            STATUS="draft"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version '$VERSION' is not a valid Play versionName."
            exit 1
          fi

          if [[ -n "$GRADLE_VERSION" && "$VERSION" != "$GRADLE_VERSION" ]]; then
            echo "::warning::Tag/dispatch version '$VERSION' differs from versionName '$GRADLE_VERSION' in android/app/build.gradle."
          fi

          {
            echo "version=$VERSION"
            echo "track=$TRACK"
            echo "upload=$UPLOAD"
            echo "regenerate=$REGENERATE"
            echo "status=$STATUS"
          } >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser
        if: steps.release_inputs.outputs.regenerate == 'true'
        run: npx playwright install --with-deps chromium

      - name: Regenerate Google Play assets
        if: steps.release_inputs.outputs.regenerate == 'true'
        run: npm run store-assets:google-play

      - name: Verify Play readiness
        run: npm run google-play:check

      - name: Verify Android project
        run: npm run android:verify

      - name: Verify signing inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_TO_PLAY: ${{ steps.release_inputs.outputs.upload }}
        run: |
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is not configured."
              exit 1
            fi
          done

          if [[ "$UPLOAD_TO_PLAY" == "true" && -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required when upload_to_play=true."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Bundle signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpm-techno-android-${{ steps.release_inputs.outputs.version }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/release-notes-v4.txt
            store-assets/google-play/listing-en-US.txt
            store-assets/google-play/play-console-submission.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload listing asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpm-techno-play-listing-assets-${{ github.run_number }}
          path: |
            store-assets/google-play/graphics/**
            store-assets/google-play/screenshots/**
            store-assets/google-play/listing-en-US.txt
            store-assets/google-play/play-console-submission.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play
        if: steps.release_inputs.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: no.bpmtech.twa
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.release_inputs.outputs.track }}
          status: ${{ steps.release_inputs.outputs.status }}
          releaseName: ${{ steps.release_inputs.outputs.version }} (${{ github.run_number }})
          whatsNewDirectory: android/play-whatsnew
