name: Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - "scripts/verify-android-project.mjs"
      - "scripts/check-google-play-readiness.mjs"
      - "scripts/generate-google-play-assets.mjs"
      - "store-assets/google-play/**"
      - "PLAY_STORE_RELEASE.md"
      - "package.json"
      - "public/.well-known/assetlinks.json"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/verify-android-project.mjs"
      - "scripts/check-google-play-readiness.mjs"
      - "scripts/generate-google-play-assets.mjs"
      - "store-assets/google-play/**"
      - "PLAY_STORE_RELEASE.md"
      - "package.json"
      - "public/.well-known/assetlinks.json"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify native Android project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Android project structure
        run: npm run android:verify

  play-assets:
    name: Verify Google Play assets
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Play readiness
        run: npm run google-play:check

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Avoid the obsolete `tools` package that setup-android@v3 still tries by default.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
