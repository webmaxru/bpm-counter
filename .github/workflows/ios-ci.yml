name: iOS CI

on:
  pull_request:
    paths:
      - ".github/workflows/ios-ci.yml"
      - "ios/**"
      - "scripts/verify-ios-project.mjs"
      - "scripts/sync-ios-branding.mjs"
      - "store-assets/apple-app-store/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-ci.yml"
      - "ios/**"
      - "scripts/verify-ios-project.mjs"
      - "scripts/sync-ios-branding.mjs"
      - "store-assets/apple-app-store/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify native iOS project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync branding and verify project
        run: |
          npm ci --ignore-scripts
          npm run ios:branding
          npm run ios:verify

  simulator:
    name: Build native iOS simulator app
    needs: verify
    # macos-14 is retired. macos-15/26 are the supported labels; capacity can
    # still cancel queued jobs after ~15m without a runner.
    runs-on: macos-15
    timeout-minutes: 60
    # Keep the PR unblocked when GitHub cannot acquire a macOS runner; Ubuntu
    # verify remains the required structural gate for this native rebuild.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=no.bpmtech.app \
            build
